name: Notify IndexNow
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Submit added, changed and removed page URLs
        run: python3 scripts/submit_indexnow.py
      - uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
