<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finder responsive review</title><style>body{margin:0;background:#e5e2df;font:16px system-ui}iframe{display:block;border:0;width:390px;height:844px;background:white}section{padding:20px}select,button{font:inherit;padding:10px}p{max-width:650px}</style><iframe id="preview" src="/product-finder/" title="Product finder preview"></iframe><section><label for="size">Review viewport</label> <select id="size"><option>390x844</option><option>320x740</option><option>360x800</option><option>375x740</option><option>430x932</option><option>768x1024</option><option>1024x900</option><option>1024x600</option><option>1093x614</option><option>1366x768</option><option>1440x1100</option><option>740x390</option><option>320x568</option><option>360x560</option><option>375x600</option><option>390x600</option><option>430x700</option><option>1920x1080</option></select> <label for="profile">Test profile</label> <select id="profile"><option value="normal">Normal browser</option><option value="legacy">Older API simulation</option><option value="reviews-offline">Reviews unavailable</option><option value="retry">Catalog failure then retry</option></select> <button id="restart">Start again</button><p>Implementation review only. Use the actual questions to navigate. Large viewports are scaled to fit. Sizes and missing-API simulations do not reproduce real operating systems or in-app browsers.</p></section><script>const frame=document.querySelector('#preview');document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.zoom=w>1400?1340/w:1};document.querySelector('#profile').onchange=e=>{frame.src=e.target.value==='normal'?'/product-finder/':'/__review/'+e.target.value+'/product-finder/'};document.querySelector('#restart').onclick=()=>frame.contentWindow.location.reload();</script></html>
